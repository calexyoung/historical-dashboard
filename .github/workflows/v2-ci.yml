# CI for Macro Atlas v2: runs on pull requests into the long-lived `v2` branch (ADR 0010).
# It never deploys, never fetches data and uploads no artefact (PLAN 6.1): pages, previews and
# browser tests use only the synthetic fixture release in fixtures/public. Tests that need v1's
# values (the legacy converter, the comparison with v1) convert v1's committed output into a
# temporary directory, print counts and names but no values, and upload nothing. v1's refresh workflow (refresh.yml) is separate
# and only runs from `main`.
name: v2-ci

on:
  pull_request:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with: { node-version: "22" } # v1's statistics tests shell out to node
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint (ruff, v2 modules)
        run: make lint-py
      - name: pytest (v1 and v2, no browser smoke test)
        run: make test

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install
        run: npm ci
      - name: Install Python (the v1 parity test runs the legacy converter into a temp dir)
        run: uv sync --locked --extra dev
      - name: Generated schema module and types are up to date
        run: npm run gen:check
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test

  site:
    # M1's acceptance tests on production builds of the site: three variants over HTTP, then a
    # real browser. Only the synthetic fixture release is served; nothing is uploaded.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - name: Install
        run: npm ci
      - name: Built-server suite (builds three variants)
        run: npm run test:built -w @macro-atlas/site
      - name: Install Chromium
        # No --with-deps: the runner image already has Chromium's libraries, and apt was the
        # step that failed when Ubuntu's mirrors were slow.
        run: npx playwright install chromium
      - name: Playwright (both base paths, phone and desktop)
        run: ATLAS_SKIP_BUILD=1 npm run test:e2e -w @macro-atlas/site

  images:
    # Builds the web image for both base paths, reads every layer for seeded values and v1 data,
    # and smoke-tests `docker compose up` on loopback. No push, no artefact.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build, inspect and smoke-test the images
        run: bash deploy/check-images.sh
