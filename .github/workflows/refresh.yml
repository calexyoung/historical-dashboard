# SPEC 10.9: weekly refresh → QA → build → tests; keep data/atlas.json + dist/index.html as a 90-day artifact (main is protected, so no commit); publish dist/ to Pages.
name: refresh

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["atlas/**", "web/**", "tests/**", ".github/**", "Makefile", "pyproject.toml", "uv.lock"]

permissions:
  contents: read   # no longer pushes to main
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # no floating major tag upstream
      - uses: actions/setup-node@v7
        with: { node-version: "22" }   # `node --check` in the build, stats tests
      - name: Install
        run: |
          uv sync --locked --extra dev   # creates .venv from uv.lock
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Fetch
        run: make fetch
      - name: Build
        run: make build     # fails soft on individual series (seed/fallback), hard on JS/size errors
      - name: Check
        run: make check     # non-zero exit on any data error
      - name: Unit tests
        run: make test
      - name: Browser smoke test
        run: make smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: snapshots, path: tests/snapshots/ }
      # main is protected (reviewed PRs only), so the refresh no longer commits data to it.
      # Each week's dataset is kept as an artifact instead; the site below is deployed from this build.
      - uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.run_id }}
          path: |
            data/atlas.json
            dist/index.html
          retention-days: 90
          if-no-files-found: error
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
