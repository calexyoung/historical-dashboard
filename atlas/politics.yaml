      - ["2007-01", "2011-01", "D House", "D"]
      - ["2011-01", "2019-01", "R House", "R"]
      - ["2019-01", "2023-01", "D House", "D"]
      - ["2023-01", "2027-01", "R House", "R"]
  senate:
    source: "https://en.wikipedia.org/wiki/Party_divisions_of_United_States_Congresses"
    rows:
      - ["2000-01", "2001-06", "R Senate", "R"]   # 50-50 from Jan 2001; VP Cheney's tie-break from Jan 20
      - ["2001-06", "2003-01", "D Senate", "D"]   # Jeffords switch, 2001-06-06
