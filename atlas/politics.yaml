# Background bands: [start month, end month (exclusive), label, style]. Month resolution; a change
# mid-month is assigned to the month in which the new holder served most days.
bands:
  fed_chair:
    source: "https://en.wikipedia.org/wiki/Chair_of_the_Federal_Reserve"
    rows:
      - ["2000-01", "2006-02", "Greenspan", "a"]
      - ["2006-02", "2014-02", "Bernanke", "b"]
      - ["2014-02", "2018-02", "Yellen", "a"]
      - ["2018-02", "2026-06", "Powell", "b"]   # term as chair ended 2026-05-15; Warsh sworn in 2026-05-22
      - ["2026-06", "2030-06", "Warsh", "a"]
  treasury:
    source: "https://en.wikipedia.org/wiki/United_States_Secretary_of_the_Treasury"
    rows:
      - ["2000-01", "2001-02", "Summers", "a"]
      - ["2001-02", "2003-01", "O'Neill", "b"]
      - ["2003-01", "2006-07", "Snow", "a"]      # Snow sworn in 2003-02-03 (Jan 2003 vacancy shown as Snow)
      - ["2006-07", "2009-02", "Paulson", "b"]
      - ["2009-02", "2013-02", "Geithner", "a"]
      - ["2013-02", "2017-02", "Lew", "b"]
      - ["2017-02", "2021-02", "Mnuchin", "a"]
      - ["2021-02", "2025-02", "Yellen", "b"]
      - ["2025-02", "2029-02", "Bessent", "a"]
